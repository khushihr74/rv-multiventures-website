
name: Extract website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract updated website ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname 'rv-multiventures-website-updated*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Updated website ZIP not found"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir -p /tmp/site
          unzip -q "$ZIP" -d /tmp/site

          SOURCE_DIR="/tmp/site"

          if [ ! -f "$SOURCE_DIR/package.json" ]; then
            PACKAGE=$(find /tmp/site -maxdepth 4 -type f -name package.json -print -quit)

            if [ -z "$PACKAGE" ]; then
              echo "ERROR: package.json not found inside ZIP"
              exit 1
            fi

            SOURCE_DIR=$(dirname "$PACKAGE")
          fi

          echo "Website folder: $SOURCE_DIR"

          cp -a "$SOURCE_DIR"/. .

          rm -f "$ZIP"

      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update website files"
            git push
          fi
