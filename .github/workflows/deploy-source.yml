name: Extract website
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website
        run: |
          ZIP=$(find . -maxdepth 1 -name 'rv-multiventures-website-final*.zip' | head -1)
          test -n "$ZIP"
          mkdir -p /tmp/site
          unzip -oq "$ZIP" -d /tmp/site
          cp -a /tmp/site/. .
          rm -f "$ZIP"
      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix website and sitemap"
          git push
