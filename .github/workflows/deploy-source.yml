
name: Extract website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract updated website ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' ! -name 'rv-multiventures-website-root.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Updated ZIP file not found!"
            echo "ZIP files available:"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "Using ZIP file: $ZIP"

          mkdir -p /tmp/site
          unzip -q "$ZIP" -d /tmp/site

          if [ -z "$(find /tmp/site -mindepth 1 -print -quit)" ]; then
            echo "ERROR: ZIP file is empty!"
            exit 1
          fi

          cp -a /tmp/site/. .
          rm -f "$ZIP"

      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update website files"
            git push
          fi
